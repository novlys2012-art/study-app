<!DOCTYPE html>
<html lang="sk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="Študijná aplikácia: z tvojich materiálov zhrnutia, kvízy a plán do skúšky.">
<meta name="theme-color" content="#1f6b58">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%231f6b58'/%3E%3Cpath d='M9 16.5l4.5 4.5L23 11' stroke='white' stroke-width='3.2' fill='none' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
<title>Study App</title>
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}</style>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700&family=Caveat:wght@600;700&family=IBM+Plex+Mono:wght@500&family=IBM+Plex+Sans:wght@400;600;700&family=JetBrains+Mono:wght@500&family=Source+Sans+3:wght@400;600&family=Fredoka:wght@500;600&family=Nunito:wght@400;600;700;800&family=Archivo+Black&family=Archivo:wght@400;600;700;800&family=DM+Mono:wght@500&display=swap">
</head>
</head>
<body>
<main>
  <header>
    <button class="crumb" id="crumb" type="button" hidden><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M10 3 5 8l5 5"/></svg><span data-i18n="header.crumb">Všetky predmety</span></button>
    <div class="eyebrow" id="eyebrow"></div>
    <h1 id="h1"></h1>
    <p class="lede" id="lede"></p>
    <div class="looks" id="looks"><span class="eyebrow" data-i18n="header.looks">Vzhľad</span>
      <button type="button" data-l="kocky" aria-pressed="true" data-i18n="look.kocky">Kocky</button>
      <button type="button" data-l="riso" aria-pressed="false" data-i18n="look.riso">Riso</button>
      <button type="button" data-l="" aria-pressed="false" data-i18n="look.kniha">Účtovná kniha</button>
      <button type="button" data-l="zosit" aria-pressed="false" data-i18n="look.zosit">Zošit</button>
      <button type="button" data-l="tabula" aria-pressed="false" data-i18n="look.tabula">Tabuľa</button>
      <button type="button" data-l="cisty" aria-pressed="false" data-i18n="look.cisty">Čistý</button>
    </div>
  </header>

  <section id="home" hidden>
    <div class="subjects" id="subjects"></div>
  </section>

  <section class="sheet" id="setup" hidden>
    <div class="group" id="progWrap">
      <p class="label" data-i18n="setup.progress">Tvoj postup na tomto zariadení</p>
      <div class="progress" id="prog"></div>
      <div><button class="link" id="reset" type="button" data-i18n="setup.reset">Vymazať postup</button></div>
      <div class="confirm" id="confirm" hidden><span data-i18n="setup.confirm">Naozaj vymazať celý postup?</span><button class="tiny danger" id="yes" type="button" data-i18n="setup.yes">Vymazať</button><button class="tiny" id="no" type="button" data-i18n="setup.no">Zrušiť</button></div>
    </div>
    <div class="group">
      <p class="label" data-i18n="setup.topic">Téma</p>
      <div class="topics" id="topics"></div>
    </div>
    <div class="group">
      <p class="label" data-i18n="setup.count">Počet otázok</p>
      <div class="seg" id="counts">
        <button type="button" data-n="10" aria-pressed="false">10</button>
        <button type="button" data-n="20" aria-pressed="true">20</button>
        <button type="button" data-n="50" aria-pressed="false">50</button>
        <button type="button" data-n="all" aria-pressed="false" data-i18n="setup.countAll">Všetky</button>
        <label class="custom" for="customN"><span data-i18n="setup.custom">Vlastný:</span><input id="customN" type="number" inputmode="numeric" min="1" step="1" placeholder="napr. 15"></label>
      </div>
    </div>
    <div class="group">
      <p class="label" data-i18n="setup.which">Ktoré otázky</p>
      <div class="seg" id="modes">
        <button type="button" data-m="all" aria-pressed="true" data-i18n="setup.modeAll">Všetky</button>
        <button type="button" data-m="new" aria-pressed="false" data-i18n="setup.modeNew">Ešte nevidené</button>
        <button type="button" data-m="wrong" aria-pressed="false" data-i18n="setup.modeWrong">Moje chyby</button>
      </div>
    </div>
    <p class="avail" id="avail"></p>
    <button class="btn" id="go" type="button" data-i18n="setup.go">Začať kolo</button>
    <p class="hint"><span data-i18n="setup.keys">Odpovedaj myšou alebo klávesmi 1–4, na ďalšiu otázku Enter.</span></p>
  </section>

  <section class="sheet" id="quiz" hidden>
    <div class="meta"><span class="eyebrow" id="qtopic"></span><span class="count" id="pos"></span></div>
    <div class="bar"><i id="pg"></i></div>
    <p class="q" id="q"></p>
    <p class="multi" id="multi" hidden data-i18n="quiz.multi">Správnych odpovedí môže byť viac. Označ všetky a potom stlač Skontrolovať.</p>
    <div class="opts" id="opts"></div>
    <div class="fb" id="fb" hidden>
      <p class="verdict" id="verdict"></p>
      <button class="link" id="toggle" type="button"></button>
      <div class="more" id="more" hidden></div>
      <div class="foot"><span class="qid" id="qid"></span><span><button class="link" id="report" type="button" data-i18n="quiz.report">Nahlásiť chybu v otázke</button> <span class="toast" id="toast" hidden></span></span></div>
    </div>
    <div class="row">
      <button class="btn" id="check" type="button" hidden data-i18n="quiz.check">Skontrolovať</button>
      <button class="btn" id="next" type="button" hidden></button>
      <button class="link" id="quit" type="button" data-i18n="quiz.quit">Ukončiť kolo</button>
    </div>
  </section>

  <section class="sheet" id="end" hidden>
    <p class="label" data-i18n="end.result">Výsledok kola</p>
    <div class="score" id="final"></div>
    <p class="lede" id="note"></p>
    <div class="group" id="missWrap">
      <p class="label" data-i18n="end.review">Na zopakovanie</p>
      <ul class="miss" id="miss"></ul>
    </div>
    <div class="row">
      <button class="btn" id="retry" type="button" data-i18n="end.retry">Zopakovať chyby</button>
      <button class="btn ghost" id="again" type="button" data-i18n="end.again">Nové kolo</button>
    </div>
  </section>

  <footer id="foot"></footer>
</main>
<script type="module" src="/src/main.js"></script>
</body>
</html>
