<!doctype html>
<html lang="sk">
<head>
  <meta charset="utf-8">
  <title>Obnovenie hesla v Lekto</title>
</head>
<body style="margin:0;padding:24px;background:#eef3f8;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;color:#0f1726">
  <div style="max-width:460px;margin:0 auto;background:#fbfdff;border:1px solid #cbd5e3;border-radius:6px;overflow:hidden">
    <div style="padding:14px 24px;background:#10233d;color:#f4f8fc;font-size:16px;font-weight:700;letter-spacing:-0.02em">Lekto</div>
    <div style="padding:24px">
      <p style="font-size:15px;line-height:1.5;margin:0 0 16px">Tvoj jednorazový kód na nastavenie nového hesla:</p>
      <p style="font-size:32px;font-weight:700;letter-spacing:6px;margin:0 0 20px;font-family:'Courier New',Courier,monospace;color:#0f1726">{{ .Token }}</p>
      <p style="font-size:14px;line-height:1.5;margin:0 0 12px;color:#445166">Zadaj tento kód v Lekto a zvoľ si nové heslo. Platí jednu hodinu a dá sa použiť len raz.</p>
      <p style="font-size:13px;line-height:1.5;margin:0;color:#58667c">Ak si o obnovenie hesla nežiadal(a), tento e-mail ignoruj – tvoje heslo ostáva nezmenené.</p>
    </div>
  </div>
</body>
</html>
