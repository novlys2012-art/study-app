<div style="font-family:Arial,Helvetica,sans-serif;max-width:480px;margin:0 auto;padding:24px;color:#1f2433">
  <p style="font-size:15px;margin:0 0 16px">Tvoj kód na prihlásenie do Study App:</p>
  <p style="font-size:34px;font-weight:700;letter-spacing:8px;margin:0 0 16px;font-family:'Courier New',monospace">{{ .Token }}</p>

  <p style="font-size:13px;color:#5b6275;margin:0 0 8px">Ak čítaš tento e-mail v tom istom prehliadači, môžeš namiesto kódu kliknúť sem:
    <a href="{{ .ConfirmationURL }}" style="color:#4f5bd5">prihlásiť sa</a></p>
  <p style="font-size:13px;color:#5b6275;margin:0">Ak si o prihlásenie nežiadal(a), tento e-mail ignoruj.</p>
</div>
