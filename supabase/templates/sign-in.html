<!doctype html>
<html lang="sk">
<head>
  <meta charset="utf-8">
  <title>Overovací kód pre Lekto</title>
</head>
<body style="margin:0;padding:24px;background:#f7f7f5;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;color:#161716">
  <div style="max-width:460px;margin:0 auto;padding:28px 24px;background:#ffffff;border:1px solid #e2e2dc;border-radius:10px">
    <p style="font-size:16px;font-weight:700;margin:0 0 16px;color:#14524c">Lekto</p>
    <p style="font-size:15px;line-height:1.5;margin:0 0 16px">Tvoj jednorazový kód na overenie e-mailu pri registrácii:</p>
    <p style="font-size:32px;font-weight:700;letter-spacing:6px;margin:0 0 20px;font-family:'Courier New',Courier,monospace;color:#161716">{{ .Token }}</p>
    <p style="font-size:14px;line-height:1.5;margin:0 0 12px;color:#595b57">Zadaj tento kód na stránke, kde si sa registroval(a). Platí jednu hodinu a dá sa použiť len raz.</p>
    <p style="font-size:13px;line-height:1.5;margin:0;color:#6e706b">Ak si si účet v Lekto nevytváral(a), tento e-mail pokojne ignoruj.</p>
  </div>
</body>
</html>
